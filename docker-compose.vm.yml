services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tradingai
      - DB_USER=tradingai
      - DB_PASSWORD=tradingai
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradingai
      POSTGRES_USER: tradingai
      POSTGRES_PASSWORD: tradingai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    mem_limit: 256m
    command: postgres -c shared_buffers=128MB -c effective_cache_size=256MB -c work_mem=4MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingai -d tradingai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: